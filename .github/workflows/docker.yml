name: Docker

# Publishes ghcr.io/thalha-a9/helix for linux/amd64 and linux/arm64 when a
# release tag is pushed, or by hand (Actions > Docker > Run workflow) for the
# version in osint/__init__.py. Changes to the image are build-tested on
# pushes to main and on pull requests, without publishing.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/helix
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', open('osint/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Helix $v"

      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.version }}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: helix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm helix:ci --version | grep -F "${{ steps.version.outputs.version }}"
          docker run --rm --entrypoint python helix:ci -c \
            "import aiohttp, aiohttp_socks, curl_cffi, imagehash, PIL, holehe, weasyprint, anthropic, openai"
          test "$(docker run --rm --entrypoint id helix:ci -u)" != 0

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build for amd64 and arm64 and publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
