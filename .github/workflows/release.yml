name: Release

# Push a tag like v3.5.0 and this builds, tests, publishes to PyPI and makes a
# GitHub release. PyPI uses Trusted Publishing: no API token is stored here.
# One-time setup is in docs/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag must match osint.__version__
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('osint/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match osint.__version__ ($version)"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test the built package, not the checkout
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl pytest pytest-asyncio aiohttp-socks
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/helix_osint-*
          /tmp/v/bin/helix-osint --version
          /tmp/v/bin/python -m pytest

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/helix-osint/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the changelog section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## v$version" 'index($0, v)==1 {on=1; next} /^## v/ && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Helix $GITHUB_REF_NAME" --notes-file notes.md
