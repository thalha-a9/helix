name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # setup-python has no Python 3.9 build for the image ubuntu-latest now
    # points to, so 3.9 runs on ubuntu-22.04, where it does.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiohttp-socks phonenumbers

      - name: Run tests
        run: pytest

      - name: Check the CLI starts
        run: python helix.py --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and check the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel and run both commands
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/helix-osint --version
          /tmp/v/bin/helix --version
