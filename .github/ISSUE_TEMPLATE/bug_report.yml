name: Bug report
description: "Something in Helix itself is broken: a crash, a wrong report, an option that doesn't work."
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: helix-osint -u johndoe --phash --report
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      description: Remove any personal data before pasting.
      render: text
  - type: input
    id: version
    attributes:
      label: Helix version
      placeholder: Helix v3.6.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - pipx / pip
        - Docker
        - BlackArch / Kali package
        - From source (git clone)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and Python version
      placeholder: Kali 2026.3, Python 3.14
