[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "helix-osint"
version = "3.2.0"
description = "Decode the digital DNA of any identity — OSINT Identity Mapper"
authors = [{name = "Thalha Ahmed", email = "sheikthalah035@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["osint","reconnaissance","security","bug-bounty","username","identity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
tls   = ["curl-cffi>=0.6.2"]
phash = ["imagehash>=4.3.1","Pillow>=10.0.0"]
email = ["holehe>=1.4.4"]
ai    = ["anthropic>=0.25.0","openai>=1.0.0"]
full  = ["curl-cffi","imagehash","Pillow","holehe","anthropic","openai"]

[project.urls]
Homepage   = "https://github.com/thalha-a9/helix"
Repository = "https://github.com/thalha-a9/helix"
Issues     = "https://github.com/thalha-a9/helix/issues"

[project.scripts]
helix = "helix:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["osint*"]
