[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-osint"
version = "3.4.0"
description = "Decode the digital DNA of any identity — OSINT Identity Mapper"
authors = [{name = "Thalha Ahmed", email = "sheikthalah035@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["osint","reconnaissance","security","bug-bounty","username","identity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
socks = ["aiohttp-socks>=0.8.4"]
dev   = ["pytest>=8", "pytest-asyncio>=0.23", "aiohttp-socks>=0.8.4"]
tls   = ["curl-cffi>=0.6.2"]
phash = ["imagehash>=4.3.1","Pillow>=10.0.0"]
email = ["holehe>=1.4.4"]
ai    = ["anthropic>=0.25.0","openai>=1.0.0"]
full  = ["curl-cffi","imagehash","Pillow","holehe","anthropic","openai","weasyprint","aiohttp-socks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage   = "https://github.com/thalha-a9/helix"
Repository = "https://github.com/thalha-a9/helix"
Issues     = "https://github.com/thalha-a9/helix/issues"

[project.scripts]
helix = "helix:main"

[tool.setuptools]
py-modules = ["helix"]

[tool.setuptools.packages.find]
where = ["."]
include = ["osint*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.setuptools.data-files]
"." = ["helix.py"]
